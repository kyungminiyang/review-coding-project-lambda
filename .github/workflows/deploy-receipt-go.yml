name: Deploy receipt-go

on:
  push:
    branches: 
      - master
    paths:
      - 'functions/receipt-go/**'
      - 'shared/**'
      - '.github/workflows/deploy-receipt-go.yml'
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read  # Required to check out the repository
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Install dependencies
        run: go mod download
      
      - name: Run tests
        run: go test -v ./functions/receipt-go/...
      
      - name: Build receipt-go
        run: |
          mkdir -p dist/receipt-go
          cd functions/receipt-go
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o ../../dist/receipt-go/bootstrap .
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Package Lambda function
        run: |
          cd dist/receipt-go
          zip function.zip bootstrap
      
      - name: Check if Lambda function exists
        id: check_function
        continue-on-error: true
        run: |
          set +e
          aws lambda get-function \
            --function-name ${{ secrets.LAMBDA_FUNCTION_PREFIX }}receipt-go \
            --region ${{ secrets.AWS_REGION }} > /dev/null 2>&1
          EXIT_CODE=$?
          set -e
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Function exists - will update code"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "📦 Function does not exist - will create new function"
          fi
      
      - name: Create Lambda function (if not exists)
        if: steps.check_function.outputs.exists == 'false'
        run: |
          aws lambda create-function \
            --function-name ${{ secrets.LAMBDA_FUNCTION_PREFIX }}receipt-go \
            --runtime provided.al2023 \
            --role ${{ secrets.LAMBDA_EXECUTION_ROLE_ARN }} \
            --handler bootstrap \
            --zip-file fileb://dist/receipt-go/function.zip \
            --region ${{ secrets.AWS_REGION }} \
            --timeout 30 \
            --memory-size 256 \
            --description "Receipt file upload API - reads and returns file size"
      
      - name: Update Lambda function code (if exists)
        if: steps.check_function.outputs.exists == 'true'
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_PREFIX }}receipt-go \
            --zip-file fileb://dist/receipt-go/function.zip \
            --region ${{ secrets.AWS_REGION }}
      
      - name: Create Function URL (if not exists)
        if: steps.check_function.outputs.exists == 'false'
        run: |
          aws lambda create-function-url-config \
            --function-name ${{ secrets.LAMBDA_FUNCTION_PREFIX }}receipt-go \
            --auth-type NONE \
            --region ${{ secrets.AWS_REGION }}
          
          # Add permission for Function URL
          aws lambda add-permission \
            --function-name ${{ secrets.LAMBDA_FUNCTION_PREFIX }}receipt-go \
            --statement-id FunctionURLAllowPublicAccess \
            --action lambda:InvokeFunctionUrl \
            --principal "*" \
            --function-url-auth-type NONE \
            --region ${{ secrets.AWS_REGION }}
      
      - name: Get Function URL
        run: |
          URL=$(aws lambda get-function-url-config \
            --function-name ${{ secrets.LAMBDA_FUNCTION_PREFIX }}receipt-go \
            --region ${{ secrets.AWS_REGION }} \
            --query 'FunctionUrl' \
            --output text)
          echo "🚀 Receipt-Go Function URL: $URL"

